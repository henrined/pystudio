android {
    namespace "com.pystudio"
    compileSdk 34

    defaultConfig {
        applicationId "com.pystudio"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DPYSTUDIO_BUILD_TESTS=OFF"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../core/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        aidl true
    }
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }
}
